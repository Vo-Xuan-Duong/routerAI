name: build

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: routerai-build-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_REVISION: 386d7c478221b7ee0c97bfe6ea61dcf65121d564

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg"
          git -C "$GITHUB_WORKSPACE/vcpkg" checkout "$VCPKG_REVISION"
          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: CTest
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Activate MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          git -C "$env:GITHUB_WORKSPACE\vcpkg" checkout "$env:VCPKG_REVISION"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: cmd
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: configure.cmd

      - name: Build
        shell: cmd
        run: build.cmd

      - name: CTest
        shell: cmd
        run: test.cmd
