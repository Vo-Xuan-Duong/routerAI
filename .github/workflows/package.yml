name: package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PACKAGE_VERSION: 0.7.0
  VCPKG_REVISION: 386d7c478221b7ee0c97bfe6ea61dcf65121d564

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          git -C "$env:GITHUB_WORKSPACE\vcpkg" checkout "$env:VCPKG_REVISION"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure

      - name: Assemble portable directory
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist/routerAI
          Copy-Item README.md,CHANGELOG.md -Destination dist/routerAI
          Compress-Archive -Path dist/routerAI/* -DestinationPath "routerAI-$env:PACKAGE_VERSION-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: routerAI-${{ env.PACKAGE_VERSION }}-windows-x64
          path: routerAI-${{ env.PACKAGE_VERSION }}-windows-x64.zip

  linux-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg"
          git -C "$GITHUB_WORKSPACE/vcpkg" checkout "$VCPKG_REVISION"
          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure, build and test
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Assemble portable directory
        shell: bash
        run: |
          cmake --install build --prefix dist/routerAI
          cp README.md CHANGELOG.md dist/routerAI/
          tar -C dist -czf "routerAI-${PACKAGE_VERSION}-linux-x64.tar.gz" routerAI

      - uses: actions/upload-artifact@v4
        with:
          name: routerAI-${{ env.PACKAGE_VERSION }}-linux-x64
          path: routerAI-${{ env.PACKAGE_VERSION }}-linux-x64.tar.gz

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-portable, linux-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: routerAI-${{ env.PACKAGE_VERSION }}-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "routerAI ${GITHUB_REF_NAME}" \
            --generate-notes
