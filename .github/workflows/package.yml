name: package

on:
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure

      - name: Assemble portable directory
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist/routerAI
          $dllDir = "build\vcpkg_installed\x64-windows\bin"
          if (Test-Path $dllDir) {
            Get-ChildItem $dllDir -Filter *.dll | Copy-Item -Destination dist/routerAI -Force
          }
          Copy-Item README.md,CHANGELOG.md -Destination dist/routerAI
          Compress-Archive -Path dist/routerAI/* -DestinationPath routerAI-0.7.0-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: routerAI-0.7.0-windows-x64
          path: routerAI-0.7.0-windows-x64.zip

  linux-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg"
          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure, build and test
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Assemble portable directory
        shell: bash
        run: |
          cmake --install build --prefix dist/routerAI
          cp README.md CHANGELOG.md dist/routerAI/
          tar -C dist -czf routerAI-0.7.0-linux-x64.tar.gz routerAI

      - uses: actions/upload-artifact@v4
        with:
          name: routerAI-0.7.0-linux-x64
          path: routerAI-0.7.0-linux-x64.tar.gz
