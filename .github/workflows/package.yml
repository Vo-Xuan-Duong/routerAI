name: package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VCPKG_REVISION: 386d7c478221b7ee0c97bfe6ea61dcf65121d564
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  linux-portable:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^project\(routerAI VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)"
          if [[ -z "$version" ]]; then
            echo "Could not resolve routerAI version from CMakeLists.txt" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version v${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Prepare vcpkg binary cache
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_REVISION }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_REVISION }}-

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg"
          git -C "$GITHUB_WORKSPACE/vcpkg" checkout "$VCPKG_REVISION"
          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure, build and test
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Assemble portable directory
        shell: bash
        run: |
          cmake --install build --prefix dist/routerAI
          cp README.md CHANGELOG.md dist/routerAI/
          tar -C dist -czf "routerAI-${PACKAGE_VERSION}-linux-x64.tar.gz" routerAI

      - uses: actions/upload-artifact@v4
        with:
          name: routerAI-${{ env.PACKAGE_VERSION }}-linux-x64
          path: routerAI-${{ env.PACKAGE_VERSION }}-linux-x64.tar.gz

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-portable]
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.linux-portable.outputs.package-version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: routerAI-${{ env.PACKAGE_VERSION }}-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "routerAI ${GITHUB_REF_NAME}" \
            --generate-notes
